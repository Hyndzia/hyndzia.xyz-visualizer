<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
  <title>Visualizer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #121212;
      color: #ddd;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(163, 0, 0, 0.18), transparent 55%),
        #121212;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      user-select: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #a30000;
      text-shadow: 0 0 18px rgba(163, 0, 0, 0.45);
    }
    p {
      margin: 0;
      color: #888;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .ring {
      width: 46px;
      height: 46px;
      border: 3px solid rgba(163, 0, 0, 0.25);
      border-top-color: #a30000;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true"></div>
  </main>
</body>
</html>
