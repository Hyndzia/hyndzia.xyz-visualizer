<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Online Visualizer</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='7') }}">
  <link rel="icon" type="image/x-icon" href="https://hyndzia.net/favicon.ico">
  <script>

    window.APP_BASE = {{ request.script_root|tojson }};
    window.appUrl = function (path) {
      path = String(path || '');
      if (path.charAt(0) !== '/') path = '/' + path;
      return window.APP_BASE + path;
    };


    (function () {
      var OLD_PREFIX = '/visualizer';
      var REMOTE_COLORS = 'https://hyndzia.net/scripts/signalColors-config.json';

      function fixUrl(url) {
        if (typeof url !== 'string') return url;
        if (url === REMOTE_COLORS) {
          return window.appUrl('/static/scripts/signalColors-config.json');
        }
        if (url.indexOf(OLD_PREFIX + '/') === 0) {
          return window.appUrl(url.slice(OLD_PREFIX.length));
        }
        return url;
      }

      var nativeFetch = window.fetch.bind(window);
      window.fetch = function (resource, options) {
        if (typeof resource === 'string') {
          return nativeFetch(fixUrl(resource), options);
        }
        if (resource && typeof resource.url === 'string') {
          return nativeFetch(fixUrl(resource.url), options);
        }
        return nativeFetch(resource, options);
      };

      var nativeOpen = window.XMLHttpRequest.prototype.open;
      window.XMLHttpRequest.prototype.open = function (method, url) {
        var args = Array.prototype.slice.call(arguments);
        args[1] = fixUrl(url);
        return nativeOpen.apply(this, args);
      };
    })();

    window.SIGNAL_COLORS_URL = {{ url_for('static', filename='scripts/signalColors-config.json', v='7')|tojson }};
  </script>

</head>
<body>
	<button id="optionsBtn" class="options-btn" title="Radio options" aria-label="Radio options">Radio</button>
	<div class="wrapper">

	<a class="back-link" href="https://hyndzia.net" title="Return to previous page">&larr; Return</a>
  <h1>Visualizer</h1>
  
  <!-- <div id="yt-search-container"> -->
    <!-- <input type="text" id="yt-query" placeholder="Search song name or paste URL" /> -->
    <!-- <button id="yt-search-btn">Add</button> -->
    <!-- <div id="yt-status"></div> -->
  <!-- </div> -->


 <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" id="fileInput" name="mp3_files" accept=".mp3, .wav, .ogg, .m4u" multiple style="display:none;">
	<button type="button" class="color-btn" onclick="document.getElementById('fileInput').click();">Select files</button>
	<span id="fileNames"></span>
	
    <button type="submit" class="color-btn">Upload</button>
</form>
<div id="progress-container">
    <div id="progress-bar"></div>
</div>
<div id="message" style="color:yellow; margin-top:10px;"></div>

  <div class="controls">
  <div class="button-with-label">
    <button id="changeEffectBtn">Bar Effect</button>
    <span id="currentEffect"></span>
  </div>

  <div class="button-with-label">
    <button id="changeWaveColorBtn">Waveform Color</button>
    <span id="waveColorDisplay">#A30000</span>
  </div>
  <div class="button-with-label">
    <button id="changeCircularColorBtn">Circular Waveform color</button>
    <span id="circularColorDisplay">#23C91A</span>
  </div>
  <div class="button-with-label">
	<button id="changeSpectrumLineColorBtn">Frequency Spectrum Color</button>
	<!-- <span id="spectrumLineColorDisplay"></span> -->
	</div>
  <div class="checkbox-with-label">
    <label><input id="bars" type="checkbox" checked> Bars</label>
  </div>
  <div class="checkbox-with-label">
    <label><input id="wave" type="checkbox" checked> Waveform</label>
  </div>
  <div class="checkbox-with-label">
    <label><input id="circularWave" type="checkbox"> Circular Waveform</label>
  </div>
  <div class="checkbox-with-label">
	<label><input id="spectrumline" type="checkbox"> Frequency Spectrum</label>
   </div>
</div>
	<div class="effects-container">
	  <div id="effects-buttons">
			<button id="bitcrusherBtn">Bitcrusher</button>
			<!-- <button id="reverbBtn">Reverb</button> -->
			<button id="phaserBtn">Phaser</button>
			<button id="bassBoostBtn">Bass Boost</button>
			<button id="delayBtn">Delay</button>
	  </div>
	</div>

  <div class="player-container">

  <canvas id="vis"></canvas>
 
  <audio id ="audioPlayer" controls crossorigin="anonymous"></audio>
  </div>

  <div id="status-container">
 		 <div id="status"></div>
  </div>

 <footer>© 2026 hyndzia.net. All rights reserved.<br>
		v0.5.0 [2026-11-09]</footer>

<ul id="playlist">
  {% for song in playlist %}
    <li>
      <span class="song-name">{{ song }}</span>
      <div class="btn-group">
        <button onclick="skipTo({{ loop.index0 }})">Play</button>
        <button class="remove-btn" onclick="removeSong('{{ song }}')">Remove</button>
      </div>
    </li>
  {% endfor %}
</ul>
</div>
<div id="optionsOverlay" class="overlay hidden">
  <div class="modal">
    <h2>Radio settings</h2>

    <label for="radioUrl">Radio stream URL</label>
    <input
      id="radioUrl"
      type="text"
      placeholder="https://radio.shinpu.top/radio.ogg"
      autocomplete="off"
    >

    <div id="recentRadiosSection" class="recent-radios" hidden>
      <span class="recent-radios-title">Recently played</span>
      <ul id="recentRadiosList"></ul>
    </div>

    <label class="modal-checkbox" for="radioStartDisabled">
      <input id="radioStartDisabled" type="checkbox" checked>
      <span>Don't start radio automatically</span>
    </label>

    <div class="modal-buttons">
      <button id="saveRadio" class="color-btn">Play</button>
      <button id="closeModal" class="color-btn">Cancel</button>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='scripts/audio-player.js', v='7') }}"></script>
<script src="{{ url_for('static', filename='scripts/signal_analyzer.js', v='7') }}"></script>
<script src="{{ url_for('static', filename='scripts/uploadForm.js', v='7') }}"></script>
<script src="{{ url_for('static', filename='scripts/updatePlaylist.js', v='7') }}"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
</body>
</html>
